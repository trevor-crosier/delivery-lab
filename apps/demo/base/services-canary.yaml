apiVersion: v1
kind: Service
metadata: { name: demo-stable, labels: { app: demo } }
spec:
  selector: { app: demo }       # Rollouts controller adds the pod-template-hash selector itself
  ports: [{ name: http, port: 9898, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: demo-canary, labels: { app: demo } }
spec:
  selector: { app: demo }
  ports: [{ name: http, port: 9898, targetPort: http }]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: { name: demo }
spec:
  hosts: [demo-stable]
  http:
    - name: primary
      route:
        - { destination: { host: demo-stable }, weight: 100 }
        - { destination: { host: demo-canary }, weight: 0 }
