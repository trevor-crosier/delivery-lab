apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: demo, labels: { app: demo } }
spec:
  selector: { matchLabels: { app: demo } }
  endpoints:
    - { port: http, path: /metrics, interval: 15s }
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: demo }
spec:
  groups:
    - name: demo
      rules:
        - alert: DemoHighErrorRate
          expr: |
            sum(rate(istio_requests_total{destination_workload="demo", response_code=~"5.."}[2m]))
              / sum(rate(istio_requests_total{destination_workload="demo"}[2m])) > 0.05
          for: 2m
          labels: { severity: page }
          annotations:
            summary: "demo error rate above 5% for 2m"
            runbook: "https://github.com/trevor-crosier/delivery-lab/blob/main/RUNBOOK.md#demo-errors"
