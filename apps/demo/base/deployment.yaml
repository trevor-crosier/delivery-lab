apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels: { app: demo }
spec:
  # no replicas: here on purpose — Lab 4 gives it to an HPA
  selector: { matchLabels: { app: demo } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  minReadySeconds: 10
  progressDeadlineSeconds: 120
  revisionHistoryLimit: 10
  template:
    metadata:
      labels: { app: demo, version: "base" }
    spec:
      containers:
        - name: demo
          image: ghcr.io/stefanprodan/podinfo:6.7.0     # confirm the tag exists in the GHCR tag list first
          ports:
            - { name: http, containerPort: 9898 }       # "http" prefix matters for Istio protocol selection
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { memory: 128Mi }
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
