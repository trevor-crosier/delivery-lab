apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata: { name: demo-smoke }
spec:
  metrics:
    - name: smoke
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              metadata:
                annotations: { sidecar.istio.io/inject: "false" }   # a Job with a sidecar never completes (Istio failure #5)
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl
                    command: ["sh", "-c", "curl -sf --max-time 5 http://demo-canary.demo:9898/healthz"]   # change to /status/500 to force a failure
